[project]
name = "minecraft-skin-gan"
version = "0.1.0"
description = "Train and evaluate a DCGAN for 64x64 Minecraft skin generation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pillow>=12.2.0",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
    "torchmetrics>=1.8.2",
    "matplotlib>=3.10.7",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "pydantic>=2.11.0",
    "wandb>=0.20.1",
    "torch-fidelity>=0.4.0",
    "ninja>=1.13.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130" },
]
torchvision = [
    { index = "pytorch-cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.scripts]
validate-configs = "scripts.validate_configs:main"
