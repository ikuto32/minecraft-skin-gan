model_name: gan_resconv_v1  # dcgan_baseline | dcgan_improved | gan_resconv_v1
mode: train
data_dir: data/skins
epochs: 100
batch_size: 256
z_dim: 32
lr: 0.0001
lr_g: 0.0001
lr_d: 0.0004
resume: null
auto_resume: true
seed: 42
deterministic: true
cudnn_benchmark: true
loss:
  name: hinge
  gp_lambda: 10.0
  r1_gamma: 10.0
  r1_interval: 16
compile: false
channels_last: true
amp_dtype: bfloat16
performance_profile: auto
num_workers: 4
persistent_workers: true
prefetch_factor: 16
eval_every: 1
eval_sample_count: 2048
eval_seed: 1234
eval_seeds: null
eval_batch_size: 256
eval_num_workers: 1
eval_output_dir: outputs/eval
kid_subsets: 50
kid_subset_size: 32
ema_beta: 0.999
use_ada: true
ada_target: 0.6
ada_grad_target: 0.2
ada_sign_weight: 0.7
ada_grad_weight: 0.3
ada_policy: flip,noise,color,translation,cutout
ada_interval: 4
ada_speed: 0.001
checkpoint_dir: checkpoints
best_metric: fid
tracking:
  backend: wandb
  project: minecraft-skin-gan
  run_name: null
  entity: null
  mlflow_tracking_uri: null
  mlflow_experiment: minecraft-skin-gan
